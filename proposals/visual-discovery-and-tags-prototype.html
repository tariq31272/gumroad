<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gumroad Modern - Visual Discovery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #faf9f6;
      color: #18181b;
      line-height: 1.45;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #ffffff;
      border-bottom: 1px solid #e4e4e7;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #18181b;
      font-weight: 800;
      font-size: 1.15rem;
    }

    .logo-box {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #e11d48, #f97316);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    .badge {
      font-size: 0.7rem;
      background: #ffe4e6;
      color: #be123c;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 700;
    }

    .search-wrap {
      flex: 1;
      min-width: 220px;
      max-width: 560px;
      display: flex;
      border: 1.5px solid #18181b;
      border-radius: 999px;
      overflow: hidden;
      background: #ffffff;
    }

    .search-wrap input {
      flex: 1;
      border: none;
      padding: 9px 14px;
      font-size: 0.92rem;
      outline: none;
    }

    .search-wrap button {
      border: none;
      background: #18181b;
      color: #ffffff;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .btn-outline {
      border: 1px solid #d4d4d8;
      background: #ffffff;
      color: #18181b;
      padding: 9px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-outline.active {
      background: #ffe4e6;
      color: #be123c;
      border-color: #fda4af;
    }

    .btn-primary {
      border: none;
      background: #e11d48;
      color: #ffffff;
      padding: 9px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px;
    }

    .hero {
      background: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .hero h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .hero p { color: #52525b; font-size: 0.92rem; }

    .stats { display: flex; gap: 10px; }
    .stat {
      background: #f4f4f5;
      border-radius: 10px;
      padding: 10px 14px;
      text-align: center;
      min-width: 90px;
    }
    .stat strong { display: block; font-size: 1.1rem; }
    .stat span { font-size: 0.75rem; color: #52525b; }

    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .cats { display: flex; gap: 8px; flex-wrap: wrap; }
    .cat-btn {
      border: 1px solid #d4d4d8;
      background: #ffffff;
      color: #18181b;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .cat-btn.active {
      background: #18181b;
      color: #ffffff;
      border-color: #18181b;
    }

    select {
      border: 1px solid #d4d4d8;
      background: #ffffff;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .summary {
      font-size: 0.88rem;
      color: #52525b;
      margin-bottom: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .thumb {
      position: relative;
      aspect-ratio: 4 / 3;
      padding: 14px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .thumb-cat {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.28);
      padding: 3px 8px;
      border-radius: 999px;
      align-self: flex-start;
    }

    .thumb-title {
      font-size: 0.98rem;
      font-weight: 800;
    }

    .heart-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: none;
      background: #ffffff;
      color: #18181b;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 700;
    }

    .heart-btn.saved {
      color: #e11d48;
      background: #ffe4e6;
    }

    .price-tag {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: #18181b;
      color: #ffffff;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 3px; }
    .card-creator { font-size: 0.8rem; color: #52525b; margin-bottom: 5px; }
    .card-rating { font-size: 0.82rem; font-weight: 700; margin-bottom: 7px; }
    .star { color: #d97706; }
    .card-desc { font-size: 0.82rem; color: #52525b; margin-bottom: 10px; }

    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
    .tag {
      border: 1px solid #e4e4e7;
      background: #f4f4f5;
      color: #27272a;
      font-size: 0.74rem;
      padding: 3px 7px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .tag.active {
      background: #18181b;
      color: #ffffff;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-bg.open { display: flex; }

    .modal-box {
      background: #ffffff;
      width: 100%;
      max-width: 460px;
      border-radius: 14px;
      padding: 20px;
    }
    .modal-box h2 { margin-bottom: 12px; font-size: 1.1rem; }
    .field { margin-bottom: 11px; }
    .field label { display: block; font-size: 0.84rem; font-weight: 700; margin-bottom: 4px; }
    .field input, .field textarea, .field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d4d4d8;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

    @media (max-width: 1000px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .container { padding: 12px; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="#" id="resetLogo">
      <span class="logo-box">G</span>
      <span>Gumroad</span>
      <span class="badge">PRO UI</span>
    </a>

    <div class="search-wrap">
      <input type="text" id="qInput" placeholder="Search title, description, or tags (notion, urdu, ui)..." />
      <button type="button" id="qBtn">Search</button>
    </div>

    <div class="actions">
      <button type="button" class="btn-outline" id="savedToggle">Saved (<span id="savedNum">0</span>)</button>
      <button type="button" class="btn-primary" id="openPub">+ Publish</button>
    </div>
  </header>

  <div class="container">
    <div class="hero">
      <div>
        <h1>Discover Digital Creations & Templates</h1>
        <p>Visual cards, ratings, wishlist heart, tags, and search for creators.</p>
      </div>
      <div class="stats">
        <div class="stat"><strong id="prodNum">0</strong><span>Products</span></div>
        <div class="stat"><strong id="tagNum">0</strong><span>Tags</span></div>
        <div class="stat"><strong>0%</strong><span>Signup</span></div>
      </div>
    </div>

    <div class="bar">
      <div class="cats" id="catList"></div>
      <select id="sortBox">
        <option value="default">Sort: Featured</option>
        <option value="rating">Highest Rated</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
      </select>
    </div>

    <div class="summary" id="summaryText">Showing products</div>
    <div class="grid" id="gridBox"></div>
  </div>

  <div class="modal-bg" id="pubModal">
    <div class="modal-box">
      <h2>Publish New Product</h2>
      <div class="field">
        <label>Title</label>
        <input type="text" id="inTitle" placeholder="e.g. Notion Client Tracker" />
      </div>
      <div class="field">
        <label>Category</label>
        <select id="inCat">
          <option value="Templates">Templates</option>
          <option value="Design">Design</option>
          <option value="UI Kits">UI Kits</option>
          <option value="E-Books">E-Books</option>
        </select>
      </div>
      <div class="field">
        <label>Price (USD)</label>
        <input type="number" id="inPrice" min="0" step="0.01" placeholder="15" />
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="inDesc" rows="3" placeholder="Short description of product..."></textarea>
      </div>
      <div class="field">
        <label>Tags (comma separated)</label>
        <input type="text" id="inTags" placeholder="notion, template, freelance" />
      </div>
      <div class="modal-btns">
        <button type="button" class="btn-outline" id="closePub">Cancel</button>
        <button type="button" class="btn-primary" id="savePub">Publish</button>
      </div>
    </div>
  </div>

  <script>
    var categories = ["All", "Templates", "Design", "UI Kits", "E-Books"];
    var colors = [
      "linear-gradient(135deg, #e11d48, #f97316)",
      "linear-gradient(135deg, #0284c7, #4f46e5)",
      "linear-gradient(135deg, #059669, #0d9488)",
      "linear-gradient(135deg, #7c3aed, #db2777)"
    ];

    var items = [
      {
        id: "1",
        title: "Freelance Client Notion Kit",
        creator: "Ayesha Studio",
        category: "Templates",
        price: 18,
        rating: 4.9,
        reviews: 120,
        desc: "Track clients, tasks, and invoices cleanly in one workspace.",
        tags: ["notion", "freelance", "template", "invoice"],
        bg: colors[1]
      },
      {
        id: "2",
        title: "Social Media Carousel Pack",
        creator: "Bilal Graphics",
        category: "Design",
        price: 14,
        rating: 4.8,
        reviews: 84,
        desc: "Ready-to-use visual layouts for creators and brands.",
        tags: ["design", "carousel", "social", "branding"],
        bg: colors[0]
      },
      {
        id: "3",
        title: "Urdu Poster & Banner Bundle",
        creator: "Zainab Art",
        category: "Design",
        price: 12,
        rating: 4.9,
        reviews: 65,
        desc: "Clean poster layouts designed for digital campaigns.",
        tags: ["urdu", "poster", "design", "banner"],
        bg: colors[2]
      },
      {
        id: "4",
        title: "Modern Web UI Component Kit",
        creator: "Hamza UI",
        category: "UI Kits",
        price: 25,
        rating: 4.7,
        reviews: 52,
        desc: "Cards, buttons, and grids for modern websites.",
        tags: ["ui", "components", "web", "kit"],
        bg: colors[3]
      }
    ];

    var savedIds = [];
    var activeCat = "All";
    var activeTag = "";
    var onlySaved = false;

    function renderCats() {
      var box = document.getElementById("catList");
      box.innerHTML = "";
      for (var i = 0; i < categories.length; i++) {
        (function(cat) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "cat-btn" + (activeCat === cat ? " active" : "");
          b.textContent = cat === "All" ? "All Products" : cat;
          b.onclick = function() {
            activeCat = cat;
            renderCats();
            renderAll();
          };
          box.appendChild(b);
        })(categories[i]);
      }
    }

    function renderAll() {
      var q = document.getElementById("qInput").value.trim().toLowerCase();
      var sortVal = document.getElementById("sortBox").value;

      var tagMap = {};
      for (var i = 0; i < items.length; i++) {
        for (var t = 0; t < items[i].tags.length; t++) {
          tagMap[items[i].tags[t]] = true;
        }
      }

      document.getElementById("prodNum").textContent = items.length;
      document.getElementById("tagNum").textContent = Object.keys(tagMap).length;
      document.getElementById("savedNum").textContent = savedIds.length;
      document.getElementById("savedToggle").className = "btn-outline" + (onlySaved ? " active" : "");

      var list = [];
      for (var j = 0; j < items.length; j++) {
        var p = items[j];
        if (onlySaved && savedIds.indexOf(p.id) === -1) continue;
        if (activeCat !== "All" && p.category !== activeCat) continue;
        if (activeTag && p.tags.indexOf(activeTag) === -1) continue;
        if (q) {
          var hitTitle = p.title.toLowerCase().indexOf(q) !== -1;
          var hitDesc = p.desc.toLowerCase().indexOf(q) !== -1;
          var hitTag = p.tags.join(" ").toLowerCase().indexOf(q) !== -1;
          if (!hitTitle && !hitDesc && !hitTag) continue;
        }
        list.push(p);
      }

      if (sortVal === "rating") {
        list.sort(function(a, b) { return b.rating - a.rating; });
      } else if (sortVal === "low") {
        list.sort(function(a, b) { return a.price - b.price; });
      } else if (sortVal === "high") {
        list.sort(function(a, b) { return b.price - a.price; });
      }

      document.getElementById("summaryText").textContent =
        "Showing " + list.length + " product(s)" + (activeTag ? " with tag #" + activeTag : "");

      var grid = document.getElementById("gridBox");
      grid.innerHTML = "";

      for (var k = 0; k < list.length; k++) {
        (function(prod) {
          var isSaved = savedIds.indexOf(prod.id) !== -1;
          var card = document.createElement("div");
          card.className = "card";

          var thumb = document.createElement("div");
          thumb.className = "thumb";
          thumb.style.background = prod.bg;

          var topCat = document.createElement("span");
          topCat.className = "thumb-cat";
          topCat.textContent = prod.category;

          var thumbTitle = document.createElement("div");
          thumbTitle.className = "thumb-title";
          thumbTitle.textContent = prod.title;

          var heart = document.createElement("button");
          heart.type = "button";
          heart.className = "heart-btn" + (isSaved ? " saved" : "");
          heart.textContent = isSaved ? "♥" : "♡";
          heart.onclick = function() {
            var idx = savedIds.indexOf(prod.id);
            if (idx === -1) savedIds.push(prod.id);
            else savedIds.splice(idx, 1);
            renderAll();
          };

          var priceBox = document.createElement("span");
          priceBox.className = "price-tag";
          priceBox.textContent = "$" + Number(prod.price).toFixed(2);

          thumb.appendChild(topCat);
          thumb.appendChild(thumbTitle);
          thumb.appendChild(heart);
          thumb.appendChild(priceBox);

          var body = document.createElement("div");
          body.className = "card-body";
          body.innerHTML =
            '<div class="card-title"></div>' +
            '<div class="card-creator"></div>' +
            '<div class="card-rating"><span class="star">★</span> ' + prod.rating + ' (' + prod.reviews + ')</div>' +
            '<div class="card-desc"></div>';

          body.querySelector(".card-title").textContent = prod.title;
          body.querySelector(".card-creator").textContent = "by " + prod.creator;
          body.querySelector(".card-desc").textContent = prod.desc;

          var tagsWrap = document.createElement("div");
          tagsWrap.className = "tags";

          for (var tIdx = 0; tIdx < prod.tags.length; tIdx++) {
            (function(tg) {
              var tb = document.createElement("button");
              tb.type = "button";
              tb.className = "tag" + (activeTag === tg ? " active" : "");
              tb.textContent = "#" + tg;
              tb.onclick = function() {
                activeTag = activeTag === tg ? "" : tg;
                renderAll();
              };
              tagsWrap.appendChild(tb);
            })(prod.tags[tIdx]);
          }

          body.appendChild(tagsWrap);
          card.appendChild(thumb);
          card.appendChild(body);
          grid.appendChild(card);
        })(list[k]);
      }
    }

    document.getElementById("qInput").oninput = renderAll;
    document.getElementById("qBtn").onclick = renderAll;
    document.getElementById("sortBox").onchange = renderAll;
    document.getElementById("savedToggle").onclick = function() {
      onlySaved = !onlySaved;
      renderAll();
    };
    document.getElementById("resetLogo").onclick = function() {
      activeCat = "All";
      activeTag = "";
      onlySaved = false;
      document.getElementById("qInput").value = "";
      renderCats();
      renderAll();
    };

    document.getElementById("openPub").onclick = function() {
      document.getElementById("pubModal").className = "modal-bg open";
    };
    document.getElementById("closePub").onclick = function() {
      document.getElementById("pubModal").className = "modal-bg";
    };
    document.getElementById("savePub").onclick = function() {
      var t = document.getElementById("inTitle").value.trim();
      var c = document.getElementById("inCat").value;
      var pr = parseFloat(document.getElementById("inPrice").value);
      var d = document.getElementById("inDesc").value.trim();
      var rawTags = document.getElementById("inTags").value.trim();

      if (!t || isNaN(pr) || !d) {
        alert("Please enter Title, Price, and Description.");
        return;
      }

      var parsedTags = [];
      var parts = (rawTags || "digital").split(",");
      for (var i = 0; i < parts.length; i++) {
        var clean = parts[i].trim().toLowerCase().replace(/\s+/g, "-");
        if (clean && parsedTags.indexOf(clean) === -1) parsedTags.push(clean);
      }

      items.unshift({
        id: String(Date.now()),
        title: t,
        creator: "You",
        category: c,
        price: pr,
        rating: 5.0,
        reviews: 1,
        desc: d,
        tags: parsedTags,
        bg: colors[items.length % colors.length]
      });

      document.getElementById("inTitle").value = "";
      document.getElementById("inPrice").value = "";
      document.getElementById("inDesc").value = "";
      document.getElementById("inTags").value = "";
      document.getElementById("pubModal").className = "modal-bg";
      renderAll();
    };

    renderCats();
    renderAll();
  </script>
</body>
</html>
